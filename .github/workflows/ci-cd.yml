name: CI/CD production

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node stays the runtime for the API, tsx and Vitest; Bun manages packages and scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test API
        run: bun run test

      - name: Build workspaces
        run: bun run build

  publish:
    name: Publish images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api-image: ${{ steps.images.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Define lowercase image names
        id: images
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/$owner/foucusly-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.api }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy:
    name: Deploy and verify production
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read last known-good release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous_sha="$(git rev-parse -q --verify refs/tags/production 2>/dev/null || true)"
          echo "sha=$previous_sha" >> "$GITHUB_OUTPUT"

      - name: Validate production configuration
        shell: bash
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          for value in COOLIFY_API_URL COOLIFY_TOKEN COOLIFY_API_UUID API_URL; do
            test -n "${!value}" || { echo "Missing production configuration: $value" >&2; exit 1; }
          done

      # The API is a Coolify "Dockerfile" application built from this repository, so
      # deploys pin the Git commit (git_commit_sha) and trigger a build by UUID.
      - name: Write Coolify deploy helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/coolify-deploy.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # Usage: coolify-deploy.sh <commit-sha>
          set -euo pipefail
          sha="$1"
          : "${COOLIFY_API_URL:?COOLIFY_API_URL is empty}" "${COOLIFY_TOKEN:?COOLIFY_TOKEN is empty}" "${COOLIFY_API_UUID:?COOLIFY_API_UUID is empty}"
          base="$(printf '%s' "$COOLIFY_API_URL" | tr -d '[:space:]')"
          while [[ "$base" == */ ]]; do base="${base%/}"; done
          base="${base%/api/v1}"; base="${base%/api}"
          while [[ "$base" == */ ]]; do base="${base%/}"; done
          api="$base/api/v1"
          echo "Coolify API base: $api"

          # coolify METHOD PATH [curl args...] -> prints body; on HTTP error prints method, path, status, body.
          coolify() {
            local method="$1" path="$2"; shift 2
            local out code
            out="$(mktemp)"
            code="$(curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              --request "$method" --header "Authorization: Bearer $COOLIFY_TOKEN" \
              --header "Accept: application/json" "$@" "$api$path")" || { echo "curl failed: $method $path" >&2; cat "$out" >&2; rm -f "$out"; return 1; }
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "Coolify API error: $method /api/v1$path -> HTTP $code" >&2
              cat "$out" >&2; echo >&2
              rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          coolify PATCH "/applications/$COOLIFY_API_UUID" \
            --header "Content-Type: application/json" \
            --data "{\"git_commit_sha\":\"$sha\"}" >/dev/null
          echo "Set git_commit_sha=$sha"

          response="$(coolify POST "/deploy?uuid=$COOLIFY_API_UUID&force=false")"
          deployment="$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$response")"
          test -n "$deployment" || { echo "Coolify did not queue a deployment: $response" >&2; exit 1; }
          echo "Queued Coolify deployment $deployment for $sha"

          for attempt in $(seq 1 90); do
            info="$(coolify GET "/deployments/$deployment" || true)"
            status="$(jq -r '.status // empty' <<<"$info" 2>/dev/null || true)"
            commit="$(jq -r '.commit // empty' <<<"$info" 2>/dev/null || true)"
            case "$status" in
              finished)
                if [ -n "$commit" ] && [ "$commit" != "HEAD" ] && [ "$commit" != "$sha" ]; then
                  echo "Coolify deployed commit $commit, expected $sha" >&2; exit 1
                fi
                echo "Deployment finished (commit=${commit:-unknown})"; exit 0 ;;
              failed|cancelled*|error)
                echo "Coolify deployment $deployment ended with status $status" >&2; exit 1 ;;
            esac
            echo "Waiting for Coolify deployment ($attempt/90): ${status:-unknown}"
            sleep 10
          done
          echo "Coolify deployment $deployment timed out" >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/coolify-deploy.sh"

          cat > "$RUNNER_TEMP/verify-api.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          # Usage: verify-api.sh <commit-sha>
          set -euo pipefail
          sha="$1"
          api_url="${API_URL%/}"
          for attempt in $(seq 1 36); do
            commit="$(curl --fail --silent --show-error --max-time 5 "$api_url/api/version" | jq -r '.commit // empty' 2>/dev/null || true)"
            if curl --fail --silent --show-error --max-time 5 "$api_url/api/health" >/dev/null; then
              # /api/version reports APP_VERSION when Coolify passes it; "unknown" is accepted
              # because the deployed commit was already verified through the Coolify API.
              if [ "$commit" = "$sha" ] || [ "$commit" = "unknown" ] || [ -z "$commit" ]; then
                echo "API healthy (version=${commit:-n/a})"; exit 0
              fi
            fi
            echo "Waiting for API ($attempt/36): version=$commit"
            sleep 10
          done
          echo "API did not become healthy with the expected version." >&2
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/verify-api.sh"

      - name: Deploy current release
        id: deploy
        shell: bash
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
        run: '"$RUNNER_TEMP/coolify-deploy.sh" "$GITHUB_SHA"'

      - name: Verify current release
        id: smoke
        shell: bash
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
        run: '"$RUNNER_TEMP/verify-api.sh" "$GITHUB_SHA"'

      - name: Restore last known-good release
        if: failure() && steps.previous.outputs.sha != ''
        shell: bash
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: '"$RUNNER_TEMP/coolify-deploy.sh" "$PREVIOUS_SHA"'

      - name: Verify restored release
        if: failure() && steps.previous.outputs.sha != ''
        shell: bash
        env:
          API_URL: ${{ vars.PUBLIC_API_URL }}
          PREVIOUS_SHA: ${{ steps.previous.outputs.sha }}
        run: '"$RUNNER_TEMP/verify-api.sh" "$PREVIOUS_SHA"'

      - name: Report missing rollback baseline
        if: failure() && steps.previous.outputs.sha == ''
        run: echo "::error::No known-good release exists; manual recovery is required."

      - name: Mark release as known good
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git tag -f production "$GITHUB_SHA"
          git push origin refs/tags/production --force
